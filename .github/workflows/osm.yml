name: osm-fetch
on:
  push:
    branches: [osm-data]
    paths: ['.github/workflows/osm.yml','osm/query*.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p osm
          for q in osm/query*.txt; do
            o="${q%.txt}.json"; o="${o/query/out}"
            for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS -m 300 --data-urlencode "data@$q" "$ep" -o "$o" && python3 -c "import json;json.load(open('$o'))" && break
            done
            ls -la "$o"
          done
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add osm/out*.json; git commit -m "osm data" || true; git push
