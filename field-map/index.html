const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.v)},key,b(P.c)))}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go'),pwEl=document.getElementById('pw');
async function attempt(pw,silent){go.disabled=true;if(!silent){err.textContent='';go.textContent='جارٍ التحقق…'}
 try{if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');const h=await open_(pw.trim());try{sessionStorage.setItem('fm_k',pw.trim())}catch(e){}show(h)}
 catch(e){go.disabled=false;go.textContent='دخول';if(!silent)err.textContent=(e&&e.message==='nocrypto')?'يلزم فتح الصفحة عبر رابط آمن (https).':'كلمة المرور غير صحيحة.';try{sessionStorage.removeItem('fm_k')}catch(_){};if(!silent){pwEl.select()}}}
f.addEventListener('submit',e=>{e.preventDefault();if(pwEl.value)attempt(pwEl.value,false)});
try{const k=sessionStorage.getItem('fm_k');if(k)attempt(k,true)}catch(e){}
})();
